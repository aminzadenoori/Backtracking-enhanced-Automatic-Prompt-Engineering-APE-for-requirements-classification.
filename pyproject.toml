[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ape-classification-tool"
version = "1.0.0"
description = "Backtracking-enhanced automatic prompt engineering for text classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
web = ["gradio>=4.0"]
figures = ["matplotlib>=3.6"]
analysis = ["scipy>=1.10", "numpy>=1.24", "pandas>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
ape-run = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
include = ["ape*"]
